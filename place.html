<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angola Country Page</title>

    <meta name="description" content="A responsive country page about Angola featuring national data, weather information, and images inspired by Angola's culture and flag colors.">
    <meta name="author" content="Blessing">

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>

<body>
    <header>
        <h1>Angola</h1>

    </header>
    <main>
        <picture>
    <source srcset="images/angola-large.webp" media="(min-width: 1000px)">
    
    <source srcset="images/angola-medium.webp" media="(min-width: 600px)">

    </main>
     <footer>
         <p>
        &copy; <span id="currentyear"></span> 🌸 Blessing Chinwe Muokwe 🌸 Angola
