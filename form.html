<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form for customers to rate and review products.">
<meta name="author" content="Blessing Muokwe">

    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

<script src="scripts/form.js" defer></script>

</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>

    <form method="get" action="review.html">
        <label for="product">Product Name</label>

<select id="product" name="product" required>
    <option value="" disabled selected>
        Select a Product ...
    </option>
</select>
<fieldset class="rating">
    <legend>Overall Rating</legend>

    <div class="rating-options">
        <div>
            <label for="rating1">☆</label>
            <input type="radio" id="rating1" name="rating" value="1" required>
        </div>

        <div>
            <label for="rating2">☆☆</label>
            <input type="radio" id="rating2" name="rating" value="2" required>
        </div>

        <div>
            <label for="rating3">☆☆☆</label>
            <input type="radio" id="rating3" name="rating" value="3" required>
        </div>

        <div>
            <label for="rating4">☆☆☆☆</label>
            <input type="radio" id="rating4" name="rating" value="4" required>
        </div>

        <div>
            <label for="rating5">☆☆☆☆☆</label>
            <input type="radio" id="rating5" name="rating" value="5" required>
        </div>
    </div>
</fieldset>

<fieldset>
    <legend>Date of Installation</legend>

    <label for="installationDate">
        
    </label>

    <input
        type="date"
        id="installationDate"
        name="installationDate"
        required>
</fieldset>

<fieldset class="features">
    <legend>Useful Features</legend>

    <p>Which features did you find useful in the product?<br>
    <em>(Check all that apply)</em></p>

    <div class="feature-option">
        <input type="checkbox" id="heat" name="features" value="Heat Retention">
        <label for="heat">Heat Retention</label>
    </div>

    <div class="feature-option">
        <input type="checkbox" id="durability" name="features" value="Durability">
        <label for="durability">Durability</label>
    </div>

    <div class="feature-option">
        <input type="checkbox" id="leakproof" name="features" value="Leak-Proof Design">
        <label for="leakproof">Leak-Proof Design</label>
    </div>

    <div class="feature-option">
        <input type="checkbox" id="clean" name="features" value="Easy to Clean">
        <label for="clean">Easy to Clean</label>
    </div>

    <div class="feature-option">
        <input type="checkbox" id="mouth" name="features" value="Wide Mouth Opening">
        <label for="mouth">Wide Mouth Opening</label>
    </div>
</fieldset>

<fieldset>
    <legend>Written Review(optional)</legend>

    <label for="review"></label>

    <textarea
        id="review"
        name="review"
        rows="5"
        cols="40">
    </textarea>
</fieldset>

<fieldset>


    <label for="username">
        Your Name (Optional)
    </label>

    <input
        type="text"
        id="username"
        name="username">
</fieldset>



<input type="submit" value="Submit Review">

</form>
    

</main>

<footer>
    <p>&copy; 2026 Blessing Muokwe | Angola</p>
</footer>

</body>
</html>
